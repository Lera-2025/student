<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport">
    <title>CAROUSEL</title>
    <link rel="stylesheet" href="./function-carousel.css">

</head>
<body>
    <h1 style="color:blue; text-align: center;">BOOKS</h1>
    <div id="carousel"> <img class="carousel-entry-img" src="" data-pause="hover">

        <div class="controls" role="group" aria-label="Управление">
        <button onclick="btn_prev()"
          aria-label="Prev"
          type="button"
          class="button-prev">
        </button>
        <button onclick="btn_next()"
          aria-label="Next"
          type="button"
          class="button-next">
        </button>
        </div>
    </div>
    <div class="carousel-entry1"></div>
    <div class="carousel-entry2"></div>
    <script src="./function-carousel.js"></script>

</body>
</html>
